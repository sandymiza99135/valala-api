<div class="payment-overlay">
  <div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-sm-8 col-md-6 col-lg-4">

        <div *ngIf="!isSuccess" class="card border-0 shadow-lg text-center p-5 rounded-4">
          <div class="mb-4 d-flex justify-content-center">
            <div
              class="icon-circle bg-danger-subtle text-danger d-inline-flex align-items-center justify-content-center rounded-circle shadow-sm">
              <i class="bi bi-x-circle-fill display-4"></i>
            </div>
          </div>
          <h2 *ngIf="isRetry" class="fw-bold mb-3">verification statut de paiement encours</h2>

          <h2 *ngIf="!isRetry" class="fw-bold mb-3">Oups...</h2>
          <p class="text-muted mb-4">{{ message }}</p>
          <div (click)="triggerShake()" [class.shake-animation]="isShaking">
            <button [disabled]="isRetry" routerLink="/products/incart"
              class="btn btn-danger btn-lg w-100 rounded-pill py-3 fw-bold">
              {{buttonName}}
            </button>
          </div>

        </div>

        <div *ngIf="isSuccess" class="card border-0 shadow-lg text-center p-5 rounded-4">
          <div class="mb-4 d-flex justify-content-center">
            <div
              class="icon-circle bg-success-subtle text-success d-inline-flex align-items-center justify-content-center rounded-circle shadow-sm">
              <i class="bi bi-check-circle-fill display-4"></i>
            </div>
          </div>
          <h2 class="fw-bold mb-3">Succès !</h2>
          <p class="text-muted mb-4">{{ message }}</p>
          <button routerLink="/" class="btn btn-success btn-lg w-100 rounded-pill py-3 fw-bold">
            Retour à l'accueil
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
