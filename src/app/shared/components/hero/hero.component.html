<section class="page-header py-5 bg-light mb-4" *ngIf="showHero">
  <div class="container text-center">
    <span *ngIf="heroBadge"
      class="badge rounded-pill bg-primary-soft text-primary px-3 py-2 mb-3 text-uppercase fw-bold">
      {{ heroBadge }}
    </span>

    <h1 class="display-4 fw-bold text-dark mb-3" [innerHTML]="heroTitle"></h1>

    <div class="title-separator mx-auto mb-4"></div>

    <p class="lead text-secondary mx-auto" style="max-width: 700px;" [innerHTML]="heroSubtitle"></p>
  </div>
</section>
