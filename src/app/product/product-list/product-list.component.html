<div class="container py-5 px-4">

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-5 justify-content-center">

    <div class="col" *ngFor="let product of products">
      <div class="card h-100 border-0 shadow-sm product-card bg-white">

        <div class="product-img-container">
          <img [src]="product.image_url" class="card-img-top" [alt]="product.name">
          <div class="rating-badge-overlay">
            <span class="badge bg-white text-dark shadow-sm">
              <mat-icon class="text-warning">star</mat-icon> 4/5
            </span>
          </div>
        </div>

        <div class="card-body p-4 d-flex flex-column">
          <h5 class="card-title fw-bold text-dark mb-3 line-clamp-2">
            {{ product.name }}
          </h5>

          <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
            <div class="price-info">
              <small class="text-muted d-block fw-bold" style="font-size: 0.65rem;">PRIX</small>
              <span class="h4 fw-bold text-dark mb-0">€{{ product.price }}</span>
            </div>
            <button class="btn btn-warning rounded-pill px-4 fw-bold shadow-sm btn-sm" (click)="goToDetails(product)">
              voir details
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
