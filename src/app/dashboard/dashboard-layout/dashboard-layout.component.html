<div class="dashboard-wrapper">
  <mat-sidenav-container class="kl-sidenav-container">
    <mat-sidenav #sidenav [opened]="false" [mode]="'over'" [fixedInViewport]="isLessThenLargeDevice">
      <ng-container *ngTemplateOutlet="sidebarContent"></ng-container>
    </mat-sidenav>

    <mat-sidenav-content>
      <header class="dashboard-header bg-white shadow-sm border-b sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
          <div class="flex items-center gap-4">
            <button *ngIf="isLessThenLargeDevice" (click)="sidenav.toggle()" mat-icon-button class="text-gray-600">
              <mat-icon>menu</mat-icon>
            </button>
            <a class="logo-link" [routerLink]="['']">
              <img src="assets/images/logo.jpg" alt="Logo" class="h-10" />
            </a>
          </div>

          <div class="flex items-center space-x-4">
            <span class="hidden md:block font-medium text-gray-600">Bonjour, {{ currentUser?.name }}</span>
            <button mat-icon-button class="relative text-gray-500 hover:text-primary">
              <mat-icon>notifications</mat-icon>
              <span class="absolute top-2 right-2 flex h-2 w-2 rounded-full bg-red-500"></span>
            </button>
            <div class="user-avatar-mini border-2 border-primary rounded-full p-0.5">
              <img [src]="currentUser?.picture || 'assets/images/avatar.png'"
                class="h-8 w-8 rounded-full shadow-inner" />
            </div>
          </div>
        </div>
      </header>

      <main class="bg-gray-50 min-h-screen">
        <div class="container mx-auto px-4">
          <div class="grid grid-cols-12 gap-6">

            <aside class="col-span-3 hidden xl:block py-8">
              <div class="sticky top-24">
                <ng-container *ngTemplateOutlet="sidebarContent"></ng-container>
              </div>
            </aside>

            <section class="col-span-12 xl:col-span-9 py-8">
              <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 min-h-[80vh]">
                <router-outlet></router-outlet>
              </div>
            </section>

          </div>
        </div>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>

<ng-template #sidebarContent>
  <div class="sidebar-container bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden w-full xl:w-72">
    <div class="user-profile-box text-center bg-gradient-to-br from-primary to-orange-600 py-10 px-5 text-white">
      <img class="mx-auto rounded-full border-4 border-white/30 w-24 h-24 object-cover shadow-lg mb-4"
        [src]="currentUser?.picture || 'assets/images/avatar.png'" alt="Profile" />
      <h4 class="font-bold text-lg mb-1">{{ currentUser?.name }}</h4>
      <p class="text-sm text-white/80 font-light truncate">{{ currentUser?.email }}</p>
    </div>

    <mat-nav-list class="custom-nav-list py-2">
      <a mat-list-item routerLink="/dashboard" [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active-link">
        <mat-icon matListIcon>dashboard</mat-icon>
        <span matLine>Tableau de bord</span>
      </a>
      <a mat-list-item routerLink="/dashboard/profile" routerLinkActive="active-link">
        <mat-icon matListIcon>account_circle</mat-icon>
        <span matLine>Mon profil</span>
      </a>
      <a mat-list-item routerLink="/dashboard/saved-items" routerLinkActive="active-link">
        <mat-icon matListIcon>shopping_bag</mat-icon>
        <span matLine>Mes produits</span>
      </a>
      <a mat-list-item routerLink="/dashboard/activity" routerLinkActive="active-link">
        <mat-icon matListIcon>event_note</mat-icon>
        <span matLine>Mes activités</span>
      </a>
      <a mat-list-item routerLink="/dashboard/orders" routerLinkActive="active-link">
        <mat-icon matListIcon>payments</mat-icon>
        <span matLine>Mes paiements</span>
      </a>

      <mat-divider></mat-divider>

      <a (click)="onLogout()" mat-list-item class="logout-item text-red-500">
        <mat-icon matListIcon>logout</mat-icon>
        <span matLine>Déconnexion</span>
      </a>
    </mat-nav-list>
  </div>
</ng-template>
