<div>
  <div class="filter flex items-center mb-5">
    <h5>Liste des activités</h5>
    <div class="flex items-center ml-auto">
      <button (click)="openActivityDialog(null)" mat-icon-button class="view__btn"><mat-icon>add</mat-icon></button>
      <button [class.text-accent]="view === 'grid'" (click)="view = 'grid'" mat-icon-button
        class="view__btn"><mat-icon>grid_view</mat-icon></button>
      <button [class.text-accent]="view === 'list'" (click)="view = 'list'" mat-icon-button
        class="view__btn"><mat-icon>list_alt</mat-icon></button>
    </div>
  </div>
  <div>
    <div *ngIf="view === 'list'" class="table-inside">
      <div class="flex flex-col border ltLg:responsive">
        <div class="flex items-center p-4 border-b hover:bg-blue-100">
          <div class="w-6/12 font-medium">
            <div class="pl-16 ml-3">Titre</div>
          </div>
          <div class="w-2/12 font-medium">Lieu</div>
          <div class="w-2/12 font-medium text-center">Date</div>
          <div class="w-2/12 font-medium">Status</div>
          <div class="w-1/12"></div>
        </div>
        <div class="flex items-center p-4 border-b hover:bg-blue-100" *ngFor="let activity of activities | slice: 0:9">
          <div class="w-6/12">
            <a href="" class="flex hover:text-primary">
              <div class="max-h-16 w-16 flex-none mr-3 border" *ngIf="activity?.images">
                <img [src]="activity?.images[0]" alt="img">
              </div>
              <h6 class="flex-auto">{{ activity?.titre }}</h6>
            </a>
          </div>
          <div class="w-2/12">{{activity.lieu}}</div>
          <div class="w-2/12 text-center">{{activity?.date_activite | date:'dd/MM/yyyy'}}</div>
          <div class="w-2/12">
            {{activity?.statut}}
          </div>

          <div class="w-1/12 text-right">
            <button class="action_icon__btn" mat-icon-button [matMenuTriggerFor]="menu">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu" xposition="before">
              <button mat-menu-item (click)="openActivityDialog(activity)">
                <mat-icon>edit</mat-icon>
                <span>Modifier</span>
              </button>
              <!-- <button mat-menu-item>
                <mat-icon>delete</mat-icon>
                <span>Delete</span>
              </button> -->
            </mat-menu>
          </div>
        </div>
      </div>
    </div>
    <!-- <div class="grid grid-cols-12 gap-4" *ngIf="view === 'grid'">
      <div class="col-span-4" *ngFor="let product of products | slice: 0:9">
        <mat-card>

            <button mat-button>SHARE</button>
          </mat-card-actions>
        </mat-card>
      </div>
    </div>
  </div> -->
  </div>
